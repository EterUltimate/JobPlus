name: CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - README.md
      - logs/**
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - README.md
      - logs/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/**/pom.xml

      - name: Verify backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Check database init script
        run: |
          test -s scripts/init-postgresql.sql
          grep -Eq "CREATE TABLE|CREATE INDEX|CREATE TRIGGER|ALTER TABLE" scripts/init-postgresql.sql

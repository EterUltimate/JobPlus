server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${JOBPLUS_DB_URL:jdbc:postgresql://localhost:5432/jobplus}
    username: ${JOBPLUS_DB_USERNAME:postgres}
    password: ${JOBPLUS_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ${JOBPLUS_MYBATIS_ID_TYPE:auto}

jobplus:
  database:
    fallback:
      enabled: ${JOBPLUS_DB_FALLBACK_ENABLED:true}
      sqlite-url: ${JOBPLUS_SQLITE_URL:jdbc:sqlite:../data/jobplus-fallback.sqlite}
      probe-timeout-ms: ${JOBPLUS_DB_PROBE_TIMEOUT_MS:1500}

jwt:
  secret: ${JWT_SECRET:jobplus-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

logging:
  level:
    com.jobplus: INFO

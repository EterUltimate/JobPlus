server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: job-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: ${JOBPLUS_DB_URL:jdbc:postgresql://localhost:5432/jobplus}
    username: ${JOBPLUS_DB_USERNAME:postgres}
    password: ${JOBPLUS_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  # Kafka configuration (optional - comment out if Kafka is not installed)
  # kafka:
  #   bootstrap-servers: localhost:9092
  #   producer:
  #     acks: all
  #     retries: 3
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ${JOBPLUS_MYBATIS_ID_TYPE:auto}

jobplus:
  database:
    fallback:
      enabled: ${JOBPLUS_DB_FALLBACK_ENABLED:true}
      sqlite-url: ${JOBPLUS_SQLITE_URL:jdbc:sqlite:../data/jobplus-fallback.sqlite}
      probe-timeout-ms: ${JOBPLUS_DB_PROBE_TIMEOUT_MS:1500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

logging:
  level:
    com.jobplus: INFO
